# Correction: an earlier version of this comment claimed Keycloak ships no
# Thai bundle at all — that was wrong. Keycloak 26.8.1's own base theme
# (theme/base/login/messages/messages_th.properties, inside the
# keycloak-themes JAR) already fully translates username, password,
# rememberMe, doForgotPassword, invalidUserMessage, missingUsernameMessage
# and most other stock login strings — confirmed by inspecting that JAR
# directly, not just the keycloak/keycloak GitHub source tree (which only
# shows the English file; the Thai one is added by Keycloak's own build
# pipeline from a separate translation source, so it doesn't show up when
# browsing that repo). The one gap found on this page: `doLogIn` has no
# Thai value upstream, so it's overridden below.
doLogIn=เข้าสู่ระบบ
